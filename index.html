<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untukmu</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a1e3f; font-family:'Segoe UI', Arial, sans-serif; }
  #sky { position:fixed; inset:0; display:block; }

  .msg-box {
    position:fixed; left:50%; top:52%; transform:translate(-50%,-50%);
    background:rgba(90,160,220,0.28);
    border:1px solid rgba(180,220,255,0.35);
    border-radius:6px;
    backdrop-filter: blur(2px);
    padding:16px 26px;
    min-width:220px; max-width:70vw;
    color:#eaf6ff;
    font-size:clamp(14px,2.2vw,20px);
    letter-spacing:0.5px;
    text-shadow:0 1px 4px rgba(0,20,50,0.6);
    opacity:0;
    transition:opacity .6s ease;
    box-shadow:0 4px 30px rgba(30,90,160,0.25);
  }
  .msg-box.show { opacity:1; }
  .cursor { display:inline-block; width:2px; height:1em; background:#eaf6ff; vertical-align:-2px; margin-left:2px; animation:blink 0.8s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }

#replay { position:fixed; left:50%; bottom:70px; transform:translateX(-50%); z-index:10;
    background:rgba(6,25,55,0.85); border:1px solid rgba(180,220,255,0.4);
    color:#eaf6ff; padding:14px 34px; border-radius:30px; cursor:pointer;
    font-size:16px; opacity:0; pointer-events:none; transition:opacity .6s; }
  #replay.show { opacity:1; pointer-events:auto; }
  #footer { position:fixed; left:0; right:0; bottom:0; z-index:5; text-align:center;
    padding:10px 0 14px; color:rgba(220,240,255,0.55); font-size:12px;
    letter-spacing:1px; text-shadow:0 1px 3px rgba(0,20,50,0.7); pointer-events:none; }
  #startBtn { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:11;
    background:rgba(6,25,55,0.85); border:1px solid rgba(180,220,255,0.4);
    color:#eaf6ff; padding:14px 40px; border-radius:30px; cursor:pointer; font-size:17px; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<audio id="music" src="music.mp3" preload="auto"></audio>
<div class="msg-box" id="msgBox"><span id="msgText"></span><span class="cursor" id="cursor"></span></div>
<button id="replay">↻ Putar Ulang</button>
<button id="startBtn">▶ Mulai</button>
<div id="footer">by Dimas Aprilian Nugraha</div>

<script>
/* ====== PESAN + WAKTU MULAI (disinkronkan dengan frasa lagu, detik) ======
   Batas frasa dari analisis energi audio: jeda vokal di ~5, 10, 15, 20, 25,
   27.8, 34.5, 37.5, 42.5, 48.5 detik. Tiap baris mulai tepat setelah jeda. */
const TIMED_MESSAGES = [
  { t:  1.0, text: "Telahhh..... Pergiii..." },
  { t:  6.7, text: "Ku bertamu ke rumah barumu" },
  { t: 12.2, text: "Tak ada kamu" },
  { t: 14.8, text: "Hanya papan dan namamu" },
  { t: 19.0, text: "Mana ocehan wewangian khasmu?" },
  { t: 25.0, text: "Jarak ini terlalu jauh" },
  { t: 27.9, text: "Kalau rindu aku tak mampu" },
  { t: 32.0, text: "Sesal hatiku tak sempat temani kamu" },
  { t: 38.0, text: "Haruskah kubisikan kata ajaib ke telingamu?" },
  { t: 44.6, text: "Soal ikhlas ternyata aku masih amatir" },
  { t: 50.6, text: "Masih sangat amatir..." }, 
  { t: 53.6, text: "..........................." }, 
];

/* ====== TYPEWRITER ====== */
const msgBox = document.getElementById('msgBox');
const msgText = document.getElementById('msgText');
const cursor = document.getElementById('cursor');
const replayBtn = document.getElementById('replay');
const startBtn = document.getElementById('startBtn');
const music = document.getElementById('music');

/* Sinkron jam musik: batas frasa dari analisis energi audio */

/* Tampilkan satu baris: mulai diketik di waktu t (detik lagu), selesai sebelum
   baris berikutnya muncul. Kecepatan ngetik mengikuti jarak antar baris. */
function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

async function typeMessage(item, nextT) {
  const dur = (nextT - item.t);              // jatah waktu baris ini (detik)
  msgText.textContent = '';
  // tunggu sampai tepat waktu mulai baris ini menurut jam musik
  while (music.currentTime < item.t) await wait(50);
  msgBox.classList.add('show');
  const typeDur = Math.min(dur * 0.6, item.text.length * 0.12); // detik ngetik
  const perChar = Math.max(0.03, typeDur / item.text.length) * 1000;
  for (let i = 1; i <= item.text.length; i++) {
    msgText.textContent = item.text.slice(0, i);
    await wait(perChar);
  }
  // menginap sampai 0.6s sebelum baris berikutnya, lalu fade
  const holdUntil = (nextT - 0.6);
  while (music.currentTime < holdUntil) await wait(100);
  msgBox.classList.remove('show');
  await wait(500);
}

async function playAll(){
  replayBtn.classList.remove('show');
  cursor.style.display = 'inline-block';
  // mulai musik dari awal + fadeout di akhir
  music.currentTime = 0;
  music.volume = 0.9;
  music.play();
  music.fadeoutTimer = setTimeout(() => {
    let v = music.volume;
    const iv = setInterval(() => {
      v -= 0.05; if (v <= 0){ music.pause(); clearInterval(iv); } else music.volume = v;
    }, 150);
  }, 52000);

  // tiap baris muncul tepat di waktunya menurut jam musik
  for (let i = 0; i < TIMED_MESSAGES.length; i++) {
    const nextT = (i + 1 < TIMED_MESSAGES.length) ? TIMED_MESSAGES[i+1].t : TIMED_MESSAGES[TIMED_MESSAGES.length-1].t + 1.0;
    await typeMessage(TIMED_MESSAGES[i], nextT);
  }
  cursor.style.display = 'none';
  replayBtn.classList.add('show');
}
startBtn.addEventListener('click', () => {
  startBtn.style.display = 'none';
  playAll();
});
replayBtn.addEventListener('click', playAll);

/* ====== BACKGROUND: langit anime ====== */
const cv = document.getElementById('sky');
const ctx = cv.getContext('2d');
let W, H, t = 0;

function resize(){
  W = cv.width = innerWidth;
  H = cv.height = innerHeight;
}
addEventListener('resize', resize); resize();

/* bintang */
const stars = Array.from({length: 140}, () => ({
  x: Math.random(), y: Math.random()*0.75,
  r: Math.random()*1.4+0.3, p: Math.random()*Math.PI*2
}));

/* partikel melayang (kunang2/kelopak cahaya) */
const parts = Array.from({length: 45}, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random()*2.5+1, s: Math.random()*0.0004+0.0002,
  dx: (Math.random()-0.5)*0.0004, p: Math.random()*Math.PI*2
}));

/* awan: blob lembut */
const clouds = [
  {x:0.25,y:0.30,r:0.28,c:'rgba(120,200,255,0.20)',v:0.00006},
  {x:0.65,y:0.22,r:0.34,c:'rgba(150,220,255,0.16)',v:0.00004},
  {x:0.85,y:0.45,r:0.26,c:'rgba(100,180,240,0.18)',v:0.00005},
  {x:0.45,y:0.55,r:0.30,c:'rgba(140,210,255,0.12)',v:0.00003},
  {x:0.10,y:0.50,r:0.22,c:'rgba(160,230,255,0.14)',v:0.00007},
];

function draw(){
  t += 1;
  // gradient langit
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#06172f');
  g.addColorStop(0.35,'#0d3a6e');
  g.addColorStop(0.62,'#1e6fb8');
  g.addColorStop(0.8,'#3a95d9');
  g.addColorStop(1,'#123a5e');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // bintang berkedip
  for (const s of stars){
    const a = 0.4 + 0.6*Math.abs(Math.sin(t*0.02 + s.p));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#dff1ff';
    ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // awan glowing (blur via radial gradient)
  for (const c of clouds){
    const cx = ((c.x + t*c.v) % 1.4 - 0.2) * W;
    const cy = c.y*H + Math.sin(t*0.003 + c.x*10)*10;
    const rad = c.r*W;
    const rg = ctx.createRadialGradient(cx,cy,0, cx,cy,rad);
    rg.addColorStop(0, c.c);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(cx-rad, cy-rad, rad*2, rad*2);
  }

  // partikel cahaya
  for (const p of parts){
    p.y -= p.s; p.x += p.dx;
    if (p.y < -0.02){ p.y = 1.02; p.x = Math.random(); }
    const a = 0.3 + 0.7*Math.abs(Math.sin(t*0.015 + p.p));
    ctx.globalAlpha = a;
    ctx.shadowColor = 'rgba(200,240,255,0.9)';
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#cfeeff';
    ctx.beginPath(); ctx.arc(p.x*W, p.y*H, p.r, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  // siluet bukit rumput gelap
  ctx.fillStyle = '#071522';
  ctx.beginPath();
  ctx.moveTo(0, H*0.80);
  for (let x=0; x<=W; x+=W/40){
    const y = H*0.80 + Math.sin(x*0.008+1)*H*0.03 + Math.sin(x*0.02)*H*0.012;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();

  // Rumput: goresan kecil di atas bukit
  ctx.strokeStyle = 'rgba(10,30,40,0.9)'; ctx.lineWidth = 2;
  for (let i=0;i<120;i++){
    const x = (i*W/120 + (i*37)%13);
    const yb = H*0.80 + Math.sin(x*0.008+1)*H*0.03 + Math.sin(x*0.02)*H*0.012;
    ctx.beginPath(); ctx.moveTo(x,yb+2);
    ctx.lineTo(x + Math.sin(t*0.02+i)*2, yb - 6 - (i%5)*2);
    ctx.stroke();
  }

  requestAnimationFrame(draw);
}
draw();

/* mulai: tombol ▶ dulu (biar musik boleh autoplay setelah klik) */
</script>
</body>
</html>
